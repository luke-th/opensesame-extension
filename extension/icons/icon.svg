<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="0.55" stop-color="#17171a"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="1" stop-color="#ff8f3d"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- top-edge highlight for depth -->
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="url(#sheen)" stroke-width="1.5"/>
  <!-- left (source) monitor -->
  <rect x="14" y="38" width="44" height="32" rx="5" fill="#ffffff" fill-opacity="0.32"/>
  <rect x="30" y="74" width="12" height="6" rx="2" fill="#ffffff" fill-opacity="0.32"/>
  <!-- right (target) monitor, highlighted -->
  <rect x="70" y="38" width="44" height="32" rx="5" fill="url(#hi)"/>
  <rect x="86" y="74" width="12" height="6" rx="2" fill="url(#hi)"/>
  <!-- arrow -->
  <path d="M40 92 H82 M74 84 L84 92 L74 100" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
